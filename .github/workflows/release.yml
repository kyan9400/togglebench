name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm lint && pnpm test && pnpm build

      - name: Package static site
        run: tar -czf "togglebench-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "togglebench-${GITHUB_REF_NAME}.tar.gz" --verify-tag --generate-notes --title "ToggleBench $GITHUB_REF_NAME"
